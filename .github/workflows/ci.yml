# Every check a contributor runs locally, on every push and pull request.
#
# No service containers: the integration suite and the end-to-end server start their own
# PostgreSQL (the `embedded-postgres` binaries) and MinIO (the official binary, downloaded
# once into .dev/) through scripts/local-services.mjs, exactly as they do on a laptop, so
# CI tests the same setup CONTRIBUTING.md describes.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit, integration and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # MinIO withdrew its downloadable binaries and images in September 2026, so the last
      # community release is built from its archived source once and cached.
      - name: Cache the MinIO binary
        id: minio
        uses: actions/cache@v4
        with:
          path: .dev/bin/minio
          key: minio-RELEASE.2025-10-15T17-29-55Z-${{ runner.os }}-${{ runner.arch }}

      - uses: actions/setup-go@v5
        if: steps.minio.outputs.cache-hit != 'true'
        with:
          go-version: '1.24'
          cache: false

      - name: Build MinIO from source
        if: steps.minio.outputs.cache-hit != 'true'
        run: scripts/build-minio.sh

      - run: npm run typecheck

      - run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Keep the Playwright traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  metro:
    name: inlet-sdk bundles with Metro on React Native 0.74
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:shared

      # AN-239: packs the tarball, installs it into a React Native 0.74 project and bundles
      # every entry a React Native application imports, for iOS and Android.
      - run: npm run test:metro -w inlet-sdk
