# Every check a contributor runs locally, on every push and pull request.
#
# No service containers: the integration suite and the end-to-end server start their own
# PostgreSQL (the `embedded-postgres` binaries), RustFS and ClickHouse (their release binaries,
# downloaded once into .dev/ and checksummed) through scripts/local-services.mjs, exactly as they
# do on a laptop, so CI tests the same setup CONTRIBUTING.md describes.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit, integration and end-to-end
    runs-on: ubuntu-latest
    # The analytics suites roughly doubled the run in Release 8 (about 14 minutes for the API
    # suite alone on a hosted runner, then end-to-end).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The RustFS binary scripts/local-services.mjs downloads and checksums, kept between
      # runs. The key names the version pinned in that script.
      - name: Cache the RustFS binary
        uses: actions/cache@v4
        with:
          path: .dev/bin/rustfs
          key: rustfs-1.0.0-${{ runner.os }}-${{ runner.arch }}

      # The same for ClickHouse, about 200 MB compressed: CLICKHOUSE_VERSION in that script.
      - name: Cache the ClickHouse binary
        uses: actions/cache@v4
        with:
          path: .dev/bin/clickhouse
          key: clickhouse-26.8.12.53-${{ runner.os }}-${{ runner.arch }}

      - run: npm run typecheck

      # `npm test` with line coverage over each workspace's src/ (scripts/coverage.mjs).
      - run: npm run test:coverage

      - name: Keep the coverage badge
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage/badge.json
          retention-days: 7

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Keep the Playwright traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # The README's coverage badge reads coverage.json on the `badges` branch through shields.io.
  # Its own job, so that the one holding a write token runs no code from the change.
  badge:
    name: Publish the coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
      - name: Commit coverage.json to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="$(mktemp -d)"
          if git ls-remote --exit-code --heads "$remote" badges > /dev/null; then
            git clone --quiet --depth 1 --branch badges "$remote" "$dir"
          else
            git init --quiet -b badges "$dir"
            git -C "$dir" remote add origin "$remote"
          fi
          cp badge.json "$dir/coverage.json"
          cd "$dir"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coverage.json
          if git diff --cached --quiet; then echo 'Coverage unchanged.'; exit 0; fi
          git commit --quiet -m "Coverage for ${GITHUB_SHA}"
          git push --quiet origin badges

  metro:
    name: inlet-sdk bundles with Metro on React Native 0.74
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:shared

      # AN-239: packs the tarball, installs it into a React Native 0.74 project and bundles
      # every entry a React Native application imports, for iOS and Android.
      - run: npm run test:metro -w inlet-sdk
