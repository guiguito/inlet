# Every check a contributor runs locally, on every push and pull request.
#
# No service containers: the integration suite and the end-to-end server start their own
# PostgreSQL (the `embedded-postgres` binaries) and RustFS (its release binary, downloaded
# once into .dev/ and checksummed) through scripts/local-services.mjs, exactly as they do on a laptop, so
# CI tests the same setup CONTRIBUTING.md describes.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit, integration and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The RustFS binary scripts/local-services.mjs downloads and checksums, kept between
      # runs. The key names the version pinned in that script.
      - name: Cache the RustFS binary
        uses: actions/cache@v4
        with:
          path: .dev/bin/rustfs
          key: rustfs-1.0.0-${{ runner.os }}-${{ runner.arch }}

      - run: npm run typecheck

      - run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Keep the Playwright traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  metro:
    name: inlet-sdk bundles with Metro on React Native 0.74
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:shared

      # AN-239: packs the tarball, installs it into a React Native 0.74 project and bundles
      # every entry a React Native application imports, for iOS and Android.
      - run: npm run test:metro -w inlet-sdk
