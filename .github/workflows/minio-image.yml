# Publishes ghcr.io/guiguito/inlet-minio, the object store of the bundled deployment,
# built from MinIO's archived source by docker/minio/Dockerfile (docs/DECISIONS.md 30).
#
# Runs when the Dockerfile changes, or by hand. amd64 and arm64 are both cross-compiled
# by Go on the runner's own architecture, so no emulation is involved.
name: MinIO image

on:
  push:
    paths:
      - docker/minio/**
      - .github/workflows/minio-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  MINIO_TAG: RELEASE.2025-10-15T17-29-55Z

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/minio
          platforms: linux/amd64,linux/arm64
          build-args: MINIO_TAG=${{ env.MINIO_TAG }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/inlet-minio:${{ env.MINIO_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The compose file pins this tag, so a fresh `docker compose up` must be able to
      # pull it without signing in.
      - name: Pull it anonymously
        run: |
          docker logout ghcr.io
          docker pull ghcr.io/${{ github.repository_owner }}/inlet-minio:${{ env.MINIO_TAG }}
