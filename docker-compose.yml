# The bundled deployment (PRD section 12.6).
#
# Data lives in named volumes, so restarts and upgrades preserve it. Pointing at an
# external PostgreSQL or S3-compatible provider is a configuration change: set the
# INLET_DATABASE_URL or INLET_S3_* variables and remove the service you no longer need.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inlet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inlet}
      POSTGRES_DB: ${POSTGRES_DB:-inlet}
    volumes:
      # Mounted at /var/lib/postgresql, not at its `data` subdirectory. The official
      # PostgreSQL 18 image stores data in a major-version-specific directory below this
      # path so that `pg_upgrade --link` works without crossing a mount boundary, and it
      # refuses to start when a volume is mounted at the old location.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-inlet} -d ${POSTGRES_DB:-inlet}']
      interval: 5s
      timeout: 5s
      retries: 20

  # The object store: RustFS, an S3-compatible server (Apache-2.0). Pinned, so an upgrade
  # is a deliberate edit here after reading its release notes. Its web console is turned
  # off and no port is published: Inlet reaches it on the compose network only.
  storage:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${INLET_S3_ACCESS_KEY_ID:-inletstorage}
      RUSTFS_SECRET_KEY: ${INLET_S3_SECRET_ACCESS_KEY:-inletstoragesecret}
      # Off explicitly: the binary starts its web console unless told not to.
      RUSTFS_CONSOLE_ENABLE: 'false'
    volumes:
      - storagedata:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:9000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

  # Optional malware scanning of uploads (PRD section 21.2). Start it with
  # `docker compose --profile malware-scanning up -d`, and set INLET_CLAMAV_HOST=clamav
  # in .env. ClamAV wants about 2 GB of memory for its signature database, which is why
  # it is opt-in rather than always on.
  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    profiles: ['malware-scanning']
    # ClamAV publishes amd64 images only, on every tag. Declaring the platform lets the
    # profile start on an arm64 host such as Apple Silicon, under emulation. Without it
    # the pull fails outright with "no matching manifest for linux/arm64". Emulation is
    # slow to load signatures; a native arm64 host that needs scanning is better off
    # pointing INLET_CLAMAV_HOST at a clamd running outside Docker.
    platform: linux/amd64
    volumes: ['clamavdb:/var/lib/clamav']
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  inlet:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - '${INLET_PORT:-3000}:3000'
    environment:
      INLET_PUBLIC_URL: ${INLET_PUBLIC_URL:-http://localhost:3000}
      INLET_LOG_LEVEL: ${INLET_LOG_LEVEL:-info}

      INLET_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-inlet}:${POSTGRES_PASSWORD:-inlet}@postgres:5432/${POSTGRES_DB:-inlet}

      # Required. Generate with: openssl rand -base64 48
      INLET_SESSION_SECRET: ${INLET_SESSION_SECRET:?set INLET_SESSION_SECRET in .env}

      # FR-001B: the first Admin account, created at first start.
      INLET_ADMIN_EMAIL: ${INLET_ADMIN_EMAIL:?set INLET_ADMIN_EMAIL in .env}
      INLET_ADMIN_PASSWORD: ${INLET_ADMIN_PASSWORD:?set INLET_ADMIN_PASSWORD in .env}
      INLET_ADMIN_NAME: ${INLET_ADMIN_NAME:-Admin}

      # FR-062C: which reverse proxies may report the client address. Leave as false
      # when Inlet is exposed directly.
      INLET_TRUSTED_PROXIES: ${INLET_TRUSTED_PROXIES:-false}

      INLET_S3_ENDPOINT: http://storage:9000
      INLET_S3_REGION: ${INLET_S3_REGION:-us-east-1}
      INLET_S3_BUCKET: ${INLET_S3_BUCKET:-inlet}
      INLET_S3_ACCESS_KEY_ID: ${INLET_S3_ACCESS_KEY_ID:-inletstorage}
      INLET_S3_SECRET_ACCESS_KEY: ${INLET_S3_SECRET_ACCESS_KEY:-inletstoragesecret}
      INLET_S3_FORCE_PATH_STYLE: 'true'

      INLET_INTENT_TTL_MINUTES: ${INLET_INTENT_TTL_MINUTES:-30}
      INLET_PENDING_UPLOAD_EXPIRY_DAYS: ${INLET_PENDING_UPLOAD_EXPIRY_DAYS:-1}

      # FR-163: the only origins a Slack notification may be POSTed to. Slack alone by
      # default. Widen it only to reach a Slack-compatible relay, and knowingly: every
      # origin here is somewhere this container can be made to send a request.
      INLET_SLACK_WEBHOOK_ORIGINS: ${INLET_SLACK_WEBHOOK_ORIGINS:-https://hooks.slack.com}

      # Set INLET_CLAMAV_HOST=clamav in .env to turn scanning on, and start the
      # clamav service with its profile.
      INLET_CLAMAV_HOST: ${INLET_CLAMAV_HOST:-}
      INLET_CLAMAV_PORT: ${INLET_CLAMAV_PORT:-3310}
      INLET_MALWARE_SCAN_REQUIRED: ${INLET_MALWARE_SCAN_REQUIRED:-false}

volumes:
  pgdata:
  storagedata:
  clamavdb:
