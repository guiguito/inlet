# Local development dependencies only. The API and web app run on the host via
# `npm run dev`. Ports are offset from the defaults so they do not collide with
# other local PostgreSQL or MinIO instances.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: inlet
      POSTGRES_PASSWORD: inlet
      POSTGRES_DB: inlet
    ports: ['5433:5432']
    volumes: ['inlet_dev_pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inlet -d inlet']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9011"
    environment:
      MINIO_ROOT_USER: inletdev
      MINIO_ROOT_PASSWORD: inletdevsecret
    ports: ['9010:9000', '9011:9011']
    volumes: ['inlet_dev_miniodata:/data']
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  inlet_dev_pgdata:
  inlet_dev_miniodata:
