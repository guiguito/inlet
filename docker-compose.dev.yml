# Local development dependencies only. The API and web app run on the host via
# `npm run dev`. Ports are offset from the defaults so they do not collide with
# other local PostgreSQL, object-store or ClickHouse instances. The same ports and credentials as
# `npm run services:up`, so either one serves `npm run dev` and the tests.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: inlet
      POSTGRES_PASSWORD: inlet
      POSTGRES_DB: inlet
    ports: ['5433:5432']
    # /var/lib/postgresql, not its data subdirectory: the PostgreSQL 18 image refuses the
    # old location (see docker-compose.yml).
    volumes: ['inlet_dev_pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inlet -d inlet']
      interval: 3s
      timeout: 3s
      retries: 20

  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: inletdev
      RUSTFS_SECRET_KEY: inletdevsecret
      # Off explicitly: the binary starts its web console unless told not to.
      RUSTFS_CONSOLE_ENABLE: 'false'
    ports: ['9010:9000']
    volumes: ['inlet_dev_storagedata:/data']
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:9000/health || exit 1']
      interval: 3s
      timeout: 3s
      retries: 30

  # The same server and users as `npm run services:up` (8124, inlet/inlet and
  # inlet_reader/inlet_reader), for a machine that would rather not run the binary.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.12.53
    environment:
      INLET_CLICKHOUSE_PASSWORD: inlet
      INLET_CLICKHOUSE_READER_PASSWORD: inlet_reader
      INLET_CLICKHOUSE_MAX_SERVER_MEMORY: '4294967296'
      INLET_CLICKHOUSE_MARK_CACHE: '268435456'
      INLET_CLICKHOUSE_BACKGROUND_POOL: '4'
    ports: ['8124:8123', '9124:9000']
    volumes:
      - inlet_dev_clickhousedata:/var/lib/clickhouse
      - ./deploy/clickhouse/config.xml:/etc/clickhouse-server/config.d/inlet.xml:ro
      - ./deploy/clickhouse/users.xml:/etc/clickhouse-server/users.d/inlet.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping || exit 1']
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  inlet_dev_pgdata:
  inlet_dev_storagedata:
  inlet_dev_clickhousedata:
